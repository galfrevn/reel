[package]
name = "reel-cli"
description = "reel — your terminal demo, edited like video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reel"
path = "src/main.rs"

[features]
default = ["video"]
# .webm output (VP9 via libvpx). Disable for a pure-Rust build — everything
# but video keeps working, and .webm renders explain what's missing.
video = ["reel-encode/video"]

[dependencies]
reel-cast = { workspace = true }
reel-term = { workspace = true }
reel-timeline = { workspace = true }
reel-format = { workspace = true }
reel-render = { workspace = true }
reel-encode = { workspace = true }
reel-audio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
notify = "8"
portable-pty = "0.9.0"
crossterm = "0.29.0"
# Maintained fork of the archived serde_yaml (RUSTSEC-2024-0320), same API.
serde_yaml_ng = "0.10"
plist = "1"
serde.workspace = true
toml.workspace = true
ureq = "3"
indicatif = "0.18"
base64 = "0.22"
serde_json = { workspace = true, features = ["preserve_order"] }
regex-lite = "0.1.9"

[dev-dependencies]
# The e2e render test decodes its own outputs with independent parsers.
gif = "0.14"
matroska = "0.30"
png = "0.18"
tempfile = "3"
