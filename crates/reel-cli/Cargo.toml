[package]
name = "reel-cli"
description = "reel — your terminal demo, edited like video"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "reel"
path = "src/main.rs"

[dependencies]
reel-cast = { workspace = true }
reel-term = { workspace = true }
reel-timeline = { workspace = true }
reel-format = { workspace = true }
reel-render = { workspace = true }
reel-encode = { workspace = true }
reel-audio = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
notify = "8"
portable-pty = "0.9.0"
crossterm = "0.29.0"
serde_yaml = "0.9"
plist = "1"
serde.workspace = true
toml.workspace = true
