name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install libvpx (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev libclang-dev
      - name: Install libvpx (macOS)
        if: runner.os == 'macOS'
        run: brew install libvpx

      - name: Build (static libvpx)
        env:
          # pkg-config-rs rule: link libvpx statically so the released
          # binary keeps the single-file promise.
          VPX_STATIC: "1"
        run: cargo build --release --target ${{ matrix.target }} -p reel-cli

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf reel-${{ matrix.target }}.tar.gz reel
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: target/${{ matrix.target }}/release/reel-${{ matrix.target }}.tar.gz
