name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # A tag on a broken commit must not ship; a v0.2.0 tag must not ship a
  # binary that reports 0.1.1.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install libvpx + fonts
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev libclang-dev fonts-dejavu fonts-noto-core fonts-powerline
      - name: Tag matches the workspace version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "tag v$tag does not match workspace version $version" >&2
            exit 1
          fi
      - name: Test
        run: cargo test --workspace

  build:
    needs: gate
    # Scoped to this job on purpose: `gate` builds against the distro's
    # libvpx through pkg-config, and env-libvpx-sys panics if VPX_VERSION
    # disagrees with what pkg-config reports.
    env:
      VPX_VERSION: "1.16.0"
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build tools
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y libclang-dev nasm
          else
            brew install nasm
          fi

      # Built from source rather than taken from the package manager.
      # `VPX_STATIC=1` on its own does nothing here: it only reaches
      # pkg-config-rs, which refuses to link a library statically when it
      # lives under a system root, so an apt/brew libvpx always comes out
      # dynamic. v0.1.1 shipped static only because that runner image
      # happened to carry no shared libvpx for the linker to prefer — an
      # accident that broke the moment the image updated. Setting
      # VPX_LIB_DIR takes env-libvpx-sys's other branch, which emits
      # `rustc-link-lib=static=vpx` outright.
      - name: Build libvpx from source (static only)
        run: |
          set -eu
          curl -fsSL "https://github.com/webmproject/libvpx/archive/refs/tags/v${VPX_VERSION}.tar.gz" | tar xz
          cd "libvpx-${VPX_VERSION}"
          ./configure --prefix="$HOME/libvpx" \
            --enable-static --disable-shared --enable-pic \
            --disable-examples --disable-tools --disable-docs --disable-unit-tests
          make -j"$(getconf _NPROCESSORS_ONLN)"
          make install
          # No .so/.dylib is produced at all, so there is nothing for the
          # linker to fall back to even if a flag were wrong.
          ls "$HOME/libvpx/lib"
          echo "VPX_LIB_DIR=$HOME/libvpx/lib" >> "$GITHUB_ENV"
          echo "VPX_INCLUDE_DIR=$HOME/libvpx/include" >> "$GITHUB_ENV"

      - name: Build
        env:
          VPX_STATIC: "1"
        run: cargo build --release --target ${{ matrix.target }} -p reel-cli

      - name: Assert the single-file promise (no dynamic libvpx)
        run: |
          bin=target/${{ matrix.target }}/release/reel
          if [ "${{ runner.os }}" = "macOS" ]; then
            deps=$(otool -L "$bin")
          else
            deps=$(ldd "$bin")
          fi
          echo "$deps"
          if echo "$deps" | grep -qi libvpx; then
            echo "released binary links libvpx dynamically" >&2
            exit 1
          fi

      - name: Package + checksum
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf reel-${{ matrix.target }}.tar.gz reel
          shasum -a 256 reel-${{ matrix.target }}.tar.gz > reel-${{ matrix.target }}.tar.gz.sha256
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/${{ matrix.target }}/release/reel-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/reel-${{ matrix.target }}.tar.gz.sha256
