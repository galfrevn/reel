name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install libvpx + fonts (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libvpx-dev libclang-dev fonts-dejavu fonts-noto-core fonts-powerline
      - name: Install libvpx (macOS)
        run: brew install libvpx
        if: runner.os == 'macOS'

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Test without video feature (pure Rust)
        run: cargo test -p reel-cli --no-default-features

  # Advisory gate: known-vulnerable or unmaintained dependencies fail the
  # build; duplicate versions only warn.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  # Best-effort: reel is untested on Windows, but the pure-Rust build
  # (everything except .webm) should compile against ConPTY via portable-pty.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (no video)
        run: cargo build -p reel-cli --no-default-features
      - name: Unit tests (no video)
        run: cargo test -p reel-cli -p reel-audio -p reel-cast -p reel-timeline -p reel-format --no-default-features
