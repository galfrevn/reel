# GitHub Action: keep README demos fresh by re-rendering them in CI.
#
#   - uses: galfrevn/reel@main
#     with:
#       files: docs/demo.reel README-hero.reel
#
# Pair it with a commit/PR step (e.g. stefanzweifel/git-auto-commit-action)
# to push the regenerated GIFs whenever the source .reel or .cast changes.

name: "reel render"
description: "Render terminal demos (.reel / .cast) to GIF, WebM, or PNG with reel"
branding:
  icon: film
  color: purple

inputs:
  files:
    description: "Space-separated .reel or .cast files to render"
    required: true
  args:
    description: "Extra arguments passed to every `reel render` (e.g. --budget 800kb)"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install reel
      shell: bash
      run: |
        curl -fsSL https://raw.githubusercontent.com/galfrevn/reel/main/setup.sh | bash
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

    - name: Render
      shell: bash
      run: |
        for f in ${{ inputs.files }}; do
          echo "::group::reel render $f"
          reel render "$f" ${{ inputs.args }}
          echo "::endgroup::"
        done
